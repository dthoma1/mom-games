<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>현실적인 사업 계획 만들기 · 크리에이터 되기</title>
<style>
  :root{--bg1:#fff1f2;--bg2:#eef2ff;--ink:#1f2937;--soft:#4b5563;--accent:#ef4444;--accent2:#f472b6;--good:#16a34a;--blue:#4f46e5}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  #app{height:100%;display:flex;flex-direction:column;align-items:center;padding:12px;max-width:1040px;margin:0 auto}
  header{width:100%;text-align:center;position:relative}h1{font-size:22px;margin:2px 0}.sub{color:var(--soft);font-size:14px;margin:0 0 8px}
  #langToggle{position:absolute;top:-2px;right:0;display:inline-flex;background:#fff;border:1px solid #e5e7eb;border-radius:999px;overflow:hidden;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:90}
  #langToggle button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:#9ca3af;font-weight:700}#langToggle button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
  #homeBtn{position:absolute;top:-2px;left:0;display:inline-flex;text-decoration:none;background:#fff;border:1px solid #e5e7eb;border-radius:999px;font-size:12px;font-weight:700;color:var(--accent);padding:6px 11px;box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:90}
  #homeBtn .en{display:none}html[lang="en"] #homeBtn .ko{display:none}html[lang="en"] #homeBtn .en{display:inline}
  #progressWrap{width:100%;height:12px;background:#ffe4e6;border-radius:999px;overflow:hidden;margin-bottom:4px}#progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}#stepText{font-size:12px;color:var(--soft);margin-bottom:8px}
  #card{position:relative;width:100%;flex:1;display:flex;flex-direction:column;min-height:0;gap:10px}#skipBtn{position:absolute;right:2px;top:-4px;font-size:12px;color:var(--soft);background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:6px 12px;cursor:pointer;z-index:80}
  #mainView{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}#banner{background:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(239,68,68,.12);padding:10px 16px;text-align:center}
  #banner .t{font-size:19px;font-weight:800}#banner .i{font-size:15px;margin-top:3px;line-height:1.5}#banner .i b{color:var(--accent)}#banner .h{font-size:13px;color:var(--soft);margin-top:4px}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(239,68,68,.1);padding:18px;overflow:auto}
  .story{width:100%;max-width:720px;text-align:center}.art{font-size:54px;line-height:1.2;margin-bottom:10px}.txt{font-size:17px;line-height:1.65;color:#374151}.txt b{color:var(--accent)}
  .choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;width:100%;max-width:680px}.choice{background:#fff;border:2px solid #dfe4ff;border-radius:15px;padding:13px;font-size:15px;font-weight:750;line-height:1.4;color:#374151;cursor:pointer}.choice:hover{border-color:#818cf8}.choice .emo{display:block;font-size:30px;margin-bottom:4px}.choice.selected,.choice.right{border-color:var(--good);background:#f0fdf4}.choice.wrong{border-color:#ef4444;background:#fff1f2}
  .gotBtn{margin-top:14px;font-size:17px;font-weight:800;color:#fff;border:0;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;padding:12px 26px;box-shadow:0 8px 20px rgba(239,68,68,.3)}
  .rule{display:flex;gap:12px;align-items:flex-start;background:#f9fafb;border-radius:13px;padding:11px 13px;margin:8px auto;max-width:650px;text-align:left;font-size:15px;line-height:1.45}.rule b{color:var(--good);font-size:18px}
  .timeline{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.month{flex:1;min-width:180px;max-width:215px;border-radius:15px;padding:13px;background:#f5f3ff;border:1px solid #ddd6fe}.month strong{display:block;color:var(--blue);margin-bottom:5px}.month div{font-size:13.5px;line-height:1.5}
  .numbers{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.number{flex:1;min-width:175px;max-width:215px;border-radius:15px;padding:14px;background:#f8fafc;border:1px solid #cbd5e1}.number strong{display:block;font-size:25px;color:var(--blue);margin-bottom:5px}.number div{font-size:13.5px;line-height:1.5;color:#475569}
  .source{font-size:11.5px;line-height:1.5;color:#64748b;margin-top:10px}.source a{color:var(--blue)}
  .plan{width:100%;max-width:670px;text-align:left;background:#fffdf7;border:2px solid #fde68a;border-radius:18px;padding:16px}.plan h2{text-align:center;margin:0 0 12px;font-size:21px}.planRow{display:flex;gap:10px;border-top:1px solid #f3e8c5;padding:9px 0;font-size:15px;line-height:1.45}.planRow:first-of-type{border-top:0}.planRow b{min-width:115px;color:#92400e}.warning{background:#fff7ed;border:1px solid #fed7aa;border-radius:13px;padding:10px 13px;margin:12px auto 0;max-width:650px;font-size:14px;line-height:1.5;color:#7c2d12}
  #finalScreen{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(239,68,68,.12);padding:26px;text-align:center}#finalScreen .tr{font-size:64px}#finalScreen .big{margin-top:14px;font-size:17px;font-weight:800;color:#fff;border:0;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;padding:12px 26px}
  #successOverlay{display:none;position:absolute;inset:0;background:rgba(255,255,255,.86);border-radius:18px;flex-direction:column;align-items:center;justify-content:center;z-index:60}#successOverlay .be{font-size:60px}#successOverlay .msg{font-size:22px;font-weight:800;margin-top:6px}
  .pulse{animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}.confetti{position:fixed;top:-40px;z-index:200;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
  @media(max-width:560px){.choiceGrid{grid-template-columns:1fr}.planRow{display:block}.planRow b{display:block;margin-bottom:3px}}
</style>
<link rel="stylesheet" href="../_shared/twocol.css" />
</head>
<body>
<div id="app">
  <header><div id="langToggle"><button data-l="ko">한국어</button><button data-l="en">EN</button></div><a id="homeBtn" href="https://dthoma1.github.io/mom-games/becoming-a-content-creator/"><span class="ko">‹ 수업 목록</span><span class="en">‹ Lessons</span></a><h1 id="h1"></h1><p class="sub" id="sub"></p><div id="progressWrap"><div id="progressBar"></div></div><div id="stepText"></div></header>
  <div id="card"><button id="skipBtn" onclick="skipLevel()"></button><div id="mainView"><div id="banner"><div class="t" id="bTitle"></div><div class="i" id="bInstr"></div><div class="h" id="bHint"></div></div><div id="stage"></div></div>
    <div id="finalScreen"><div class="tr">🌱</div><div style="font-size:26px;font-weight:800" id="finalTitle"></div><div style="font-size:17px;margin-top:8px;max-width:650px;line-height:1.6" id="finalMsg"></div><button class="big" id="restartBtn" onclick="restart()"></button><div style="margin-top:12px"><a id="hubLink" href="https://dthoma1.github.io/mom-games/becoming-a-content-creator/" style="text-decoration:none;font-size:15px;font-weight:700;color:var(--accent)"></a></div></div>
    <div id="successOverlay"><div class="be">🎉</div><div class="msg" id="successMsg"></div></div>
  </div>
</div>
<script>
let LANG=localStorage.getItem("momLang")||"ko";
function T(o){return o&&typeof o==="object"&&"ko" in o?(o[LANG]!=null?o[LANG]:o.ko):o}
const UI={h1:{ko:"🧭 현실적인 사업 계획 만들기",en:"🧭 A Realistic Creator Plan"},sub:{ko:"영상은 재미있게, 돈은 생기면 즐거운 보너스!",en:"Make videos for fun—any money is a happy bonus!"},skip:{ko:"건너뛰기 ›",en:"Skip ›"},got:{ko:"좋아요 ›",en:"Sounds good ›"},restart:{ko:"새 계획 만들기 🔁",en:"Build another plan 🔁"},hub:{ko:"🏠 수업 목록으로",en:"🏠 Back to lessons"},finalTitle:{ko:"즐거운 90일 계획 완성!",en:"Your fun-first 90-day plan is ready!"},finalMsg:{ko:"가장 중요한 목표는 <b>영상을 만들며 즐거운 것</b>이에요. 조회 수가 적어도, 수입이 0원이어도 즐거웠다면 성공이에요. 돈이 생긴다면 감사한 보너스로 생각해요.",en:"The most important goal is to <b>enjoy making videos</b>. If the views are small and income is $0, having fun still makes it a success. Any money earned is a welcome bonus."},step:{ko:(a,b)=>`${a} / ${b} 단계`,en:(a,b)=>`Step ${a} / ${b}`},done:{ko:"완료! 🎊",en:"Done! 🎊"}};
const plan={platform:{ko:"인스타그램",en:"Instagram"},focus:{ko:"내가 잘 아는 한 가지",en:"one topic I know well"},pace:{ko:"주 2회",en:"twice a week"}};
const els={stage:document.getElementById("stage"),main:document.getElementById("mainView"),final:document.getElementById("finalScreen"),bar:document.getElementById("progressBar"),step:document.getElementById("stepText"),overlay:document.getElementById("successOverlay")};
function applyStatic(){document.documentElement.lang=LANG;document.getElementById("h1").textContent=T(UI.h1);document.getElementById("sub").textContent=T(UI.sub);document.getElementById("skipBtn").textContent=T(UI.skip);document.getElementById("restartBtn").textContent=T(UI.restart);document.getElementById("hubLink").textContent=T(UI.hub);document.getElementById("finalTitle").textContent=T(UI.finalTitle);document.getElementById("finalMsg").innerHTML=T(UI.finalMsg);document.querySelectorAll("#langToggle button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG))}
document.querySelectorAll("#langToggle button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;localStorage.setItem("momLang",LANG);applyStatic();if(els.final.style.display==="flex")els.step.textContent=T(UI.done);else loadLevel(current)});
function story(html,api){els.stage.innerHTML="";const d=document.createElement("div");d.className="story";d.innerHTML=html;const b=document.createElement("button");b.className="gotBtn pulse";b.textContent=T(UI.got);b.onclick=api.next;d.appendChild(b);els.stage.appendChild(d)}
function choices(items,onPick){els.stage.innerHTML='<div class="choiceGrid"></div>';const grid=els.stage.firstElementChild;items.forEach(item=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`<span class="emo">${item.emo}</span>${T(item.label)}`;b.onclick=()=>{grid.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");onPick(item)};grid.appendChild(b)})}
const levels=[
  {title:{ko:"첫 번째 목표는 재미예요",en:"Fun is the first goal"},instr:{ko:"좋아하는 영상을 만드는 <b>취미</b>로 시작해요. 돈은 목표가 아니라 보너스예요.",en:"Start as a <b>hobby</b> making videos you enjoy. Money is a bonus, not the goal."},hint:{ko:"즐거웠다면 이미 성공이에요.",en:"If it was fun, it was already a success."},build(api){story(`<div class="art">🎥 💛 😊</div><div class="txt">${T({ko:"조회 수가 적어도 괜찮아요. 수입이 0원이어도 괜찮아요. 새로운 영상을 만들며 즐겁고 가족이나 친구 한 명과 나눌 수 있다면 충분히 가치 있어요. <b>취미가 일이 되어 부담스럽게 느껴지면 언제든 쉬어도 돼요.</b>",en:"Small view counts are okay. Earning $0 is okay. If making a video is enjoyable and you can share it with even one friend or family member, it has value. <b>If the hobby starts feeling like a stressful job, it is always okay to pause.</b>"})}</div>`,api)}},
  {title:{ko:"계정이 많으면 재미가 줄 수 있어요",en:"Too many accounts can reduce the fun"},instr:{ko:"여러 계정을 관리하기보다 <b>가장 재미있는 한 곳</b>에서 놀아 봐요.",en:"Instead of managing many accounts, play on <b>one platform you enjoy most</b>."},hint:{ko:"처음 90일은 가벼운 취미 실험이에요.",en:"Treat the first 90 days as a lighthearted hobby experiment."},build(api){story(`<div class="art">📱📱📱 😵‍💫</div><div class="txt">${T({ko:"여러 플랫폼을 한꺼번에 관리하면 촬영보다 로그인과 알림에 더 많은 시간을 써요. 지금 만든 계정은 삭제하지 않아도 돼요. <b>한 곳만 골라 즐기고, 나머지는 잠시 쉬게 두세요.</b>",en:"Managing many platforms at once can consume more time than creating. You do not need to delete the accounts. <b>Enjoy one home platform and let the others rest for now.</b>"})}</div>`,api)}},
  {title:{ko:"주력 플랫폼 하나 고르기",en:"Choose one home platform"},instr:{ko:"앞으로 90일 동안 콘텐츠를 올릴 <b>한 곳</b>을 골라요.",en:"Choose <b>one place</b> to publish for the next 90 days."},hint:{ko:"이미 가장 편한 곳이 좋은 시작점이에요.",en:"The platform you already find easiest is a good start."},build(api){choices([{emo:"📸",label:{ko:"인스타그램 · 짧은 사진과 릴스",en:"Instagram · photos and short Reels"},value:{ko:"인스타그램",en:"Instagram"}},{emo:"▶️",label:{ko:"유튜브 · 검색되는 긴 영상",en:"YouTube · searchable longer videos"},value:{ko:"유튜브",en:"YouTube"}},{emo:"✍️",label:{ko:"블로그 · 글과 사진 설명",en:"Blog · written and photo guides"},value:{ko:"블로그",en:"Blog"}}],item=>{plan.platform=item.value;setTimeout(api.next,350)})}},
  {title:{ko:"실험하며 내 주제를 찾아요",en:"Experiment to find your topic"},instr:{ko:"성공한 크리에이터는 보통 한 주제로 알려져요. 하지만 그들도 처음에는 <b>여러 가지를 시도하며</b> 그 주제를 찾았어요.",en:"Successful creators often become known for one topic. But they usually find it by <b>trying many things</b> first."},hint:{ko:"고집부리지 말고 첫 90일 동안 다양하게 실험해요. 지금은 먼저 해 볼 것 하나만 골라요.",en:"Don't be stubborn—experiment during your first 90 days. For now, choose just one thing to try first."},build(api){choices([{emo:"🍲",label:{ko:"먼저 쉬운 집밥 영상을 해 볼래요",en:"First, try an easy home-meal video"},value:{ko:"쉬운 집밥 영상부터 시작해 보기",en:"start by trying an easy home-meal video"}},{emo:"🧵",label:{ko:"먼저 쉬운 손뜨개 영상을 해 볼래요",en:"First, try a simple knitting video"},value:{ko:"쉬운 손뜨개 영상부터 시작해 보기",en:"start by trying a simple knitting video"}},{emo:"🌿",label:{ko:"먼저 식물 영상을 해 볼래요",en:"First, try a plant-care video"},value:{ko:"식물 영상부터 시작해 보기",en:"start by trying a plant-care video"}},{emo:"💡",label:{ko:"먼저 다른 재미있는 주제를 해 볼래요",en:"First, try another topic that sounds fun"},value:{ko:"재미있어 보이는 주제부터 시작해 보기",en:"start with any topic that sounds fun"}}],item=>{plan.focus=item.value;setTimeout(api.next,350)})}},
  {title:{ko:"지킬 수 있는 게시 일정",en:"Choose a sustainable schedule"},instr:{ko:"완벽한 계획보다 <b>지킬 수 있는 약속</b>이 좋아요.",en:"A <b>promise you can keep</b> beats a perfect plan."},hint:{ko:"처음에는 주 2회를 추천해요.",en:"Twice a week is a good starting point."},build(api){choices([{emo:"🌱",label:{ko:"주 1회 · 가장 여유롭게",en:"Once a week · most relaxed"},value:{ko:"주 1회",en:"once a week"}},{emo:"🌿",label:{ko:"주 2회 · 추천",en:"Twice a week · recommended"},value:{ko:"주 2회",en:"twice a week"}},{emo:"🌳",label:{ko:"주 3회 · 시간이 충분할 때",en:"Three times a week · when time allows"},value:{ko:"주 3회",en:"three times a week"}}],item=>{plan.pace=item.value;setTimeout(api.next,350)})}},
  {title:{ko:"비싼 장비는 필요 없어요",en:"You don't need fancy equipment"},instr:{ko:"어떤 사람들은 비싼 카메라와 녹음 장비가 꼭 필요하다고 말할 수 있어요. <b>하지만 그렇지 않아요.</b>",en:"You might see people insist that you need a fancy camera and recording equipment. <b>That's not necessary.</b>"},hint:{ko:"휴대폰과 창가 빛으로도 멋진 영상을 만들 수 있어요.",en:"A phone and window light are enough to make lovely videos."},build(api){story(`<div class="rule"><b>1</b><span>${T({ko:"첫 90일 예산은 가능하면 월 0~5만원 이내로 정해요.",en:"Keep the first 90-day budget around $0–$40 per month if possible."})}</span></div><div class="rule"><b>2</b><span>${T({ko:"새 장비는 같은 불편을 세 번 겪은 뒤에만 사요.",en:"Buy equipment only after the same limitation causes trouble three times."})}</span></div><div class="rule"><b>3</b><span>${T({ko:"무료 체험은 종료일을 달력에 적고, 쓰지 않는 구독은 취소해요.",en:"Put free-trial end dates on the calendar and cancel unused subscriptions."})}</span></div><div class="warning">${T({ko:"첫 몇 달 수익이 0원이어도 실패가 아니에요. 생활비로 쓸 수입을 약속하거나 빚을 내서 장비를 사지 않아요.",en:"Earning $0 in the first months is not failure. Do not promise household income or borrow money for creator equipment."})}</div>`,api)}},
  {title:{ko:"성공한 계정만 보면 착시가 생겨요",en:"Successful accounts create an illusion"},instr:{ko:"눈에 잘 보이는 스타는 <b>평균이 아니라 아주 드문 예외</b>예요.",en:"The stars we notice are <b>rare outliers, not the average</b>."},hint:{ko:"월스트리트저널이 소개한 700만 개 계정의 지급 자료예요.",en:"These payout figures cover 7 million accounts reported by The Wall Street Journal."},build(api){story(`<div class="numbers"><div class="number"><strong>7,000,000</strong><div>${T({ko:"분석된 크리에이터 계정",en:"creator accounts analyzed"})}</div></div><div class="number"><strong>350,000</strong><div>${T({ko:"1년에 $1,000 넘게 번 계정 · 약 5%",en:"earned over $1,000 in a year · about 5%"})}</div></div><div class="number"><strong>2,000</strong><div>${T({ko:"1년에 $100,000 넘게 번 계정 · 약 0.03%",en:"earned over $100,000 in a year · about 0.03%"})}</div></div></div><div class="warning">${T({ko:"약 95%는 1년에 $1,000도 넘지 못했어요. 연 $100,000를 넘긴 계정은 약 3,500개 중 1개뿐이에요. 그래서 돈을 기대하기보다 재미로 만들고, 수입이 생기면 즐거운 보너스로 생각하는 것이 현실적이에요.",en:"About 95% did not exceed $1,000 for the year. Only about 1 in 3,500 accounts exceeded $100,000. That is why it is realistic to create for fun and treat any income as a happy bonus."})}</div><div class="source">${T({ko:"출처: 월스트리트저널이 보도한 크리에이터 계정 지급 자료. 이 수치는 해당 자료에 포함된 계정만 설명해요.",en:"Source: creator-account payout data reported by The Wall Street Journal. These figures describe only the accounts included in that dataset."})}</div>`,api)}},
  {title:{ko:"YouTube 광고 수익의 규모",en:"The scale of YouTube ad revenue"},instr:{ko:"YouTube는 <b>조회 수 1,000회당 실제 수익(RPM)</b>으로 계산해요. 모든 조회에 광고가 붙지는 않아요.",en:"YouTube uses <b>actual revenue per 1,000 views (RPM)</b>. Not every view carries an ad."},hint:{ko:"RPM 3달러를 가정한 계획용 예시예요.",en:"This planning example assumes a US$3 RPM."},build(api){story(`<div class="numbers"><div class="number"><strong>10,000</strong><div>${T({ko:"월 조회 수 → 약 $30",en:"monthly views → about $30"})}</div></div><div class="number"><strong>100,000</strong><div>${T({ko:"월 조회 수 → 약 $300",en:"monthly views → about $300"})}</div></div><div class="number"><strong>1,000,000</strong><div>${T({ko:"월 조회 수 → 약 $3,000",en:"monthly views → about $3,000"})}</div></div></div><div class="warning">${T({ko:"이것은 보장이 아니라 계산 예시예요. 실제 RPM은 주제, 시청자 국가, 계절, 광고 가능 여부에 따라 크게 달라요. 광고 수익 신청 전에는 보통 구독자 1,000명과 최근 12개월 공개 시청 4,000시간, 또는 최근 90일 유효 Shorts 조회 1,000만 회가 필요하고 심사도 통과해야 해요.",en:"This is arithmetic, not a promise. Actual RPM varies greatly by topic, viewer country, season, and ad eligibility. Ad revenue generally requires 1,000 subscribers plus 4,000 public watch hours in 12 months, or 10 million valid Shorts views in 90 days, followed by review."})}</div><div class="source">${T({ko:"공식 설명",en:"Official references"})}: <a href="https://support.google.com/youtube/answer/9314357" target="_blank" rel="noopener">YouTube RPM</a> · <a href="https://support.google.com/youtube/answer/72851" target="_blank" rel="noopener">YPP eligibility</a></div>`,api)}},
  {title:{ko:"Instagram 팔로워는 월급이 아니에요",en:"Instagram followers are not a salary"},instr:{ko:"Instagram에는 모든 계정에 적용되는 <b>조회당 고정 지급액</b>이 없어요.",en:"Instagram has no <b>universal fixed payment per view</b> for every account."},hint:{ko:"큰 팔로워 수와 실제 수입은 다른 숫자예요.",en:"A large follower count and income are different numbers."},build(api){story(`<div class="numbers"><div class="number"><strong>10K</strong><div>${T({ko:"팔로워가 있어도 협찬·구독·선물이 없으면 $0일 수 있어요.",en:"followers can still mean $0 without deals, subscriptions, or gifts."})}</div></div><div class="number"><strong>10K ⭐</strong><div>${T({ko:"선물 Stars 1만 개는 자격을 갖춘 계정에 $100예요.",en:"Gift Stars equal $100 for an eligible account."})}</div></div><div class="number"><strong>62%</strong><div>${T({ko:"2025년 브랜드 지급액 중 상위 10% 크리에이터가 받은 몫",en:"of 2025 brand payments went to the top 10% of creators"})}</div></div></div><div class="warning">${T({ko:"브랜드 캠페인을 받은 사람들 사이에서도 평균 지급액은 $11,400이지만 중앙값은 $3,000이었어요. 소수의 큰 계약이 평균을 끌어올린다는 뜻이에요. 캠페인은 매달 보장되지 않아요.",en:"Even among creators receiving brand campaigns, the average payment was $11,400 while the median was $3,000. A few huge deals pull up the average, and campaigns are not guaranteed every month."})}</div><div class="source">${T({ko:"출처",en:"Sources"})}: <a href="https://www.creatoriq.com/press/releases/state-of-creator-compensation-" target="_blank" rel="noopener">CreatorIQ 2026</a> · <a href="https://www.facebook.com/help/instagram/738469380549477" target="_blank" rel="noopener">Instagram Gifts</a></div>`,api)}},
  {title:{ko:"현실적인 90일 로드맵",en:"A realistic 90-day roadmap"},instr:{ko:"한 달씩 <b>만들기 → 배우기 → 시험하기</b>로 진행해요.",en:"Move through <b>create → learn → test</b>, one month at a time."},hint:{ko:"수익보다 먼저 꾸준함과 반응을 확인해요.",en:"Measure consistency and response before revenue."},build(api){story(`<div class="timeline"><div class="month"><strong>${T({ko:"1~30일 · 만들기",en:"Days 1–30 · Create"})}</strong><div>${T({ko:"정한 일정대로 올려요. 새 장비와 새 플랫폼은 추가하지 않아요.",en:"Publish on schedule. Add no new equipment or platforms."})}</div></div><div class="month"><strong>${T({ko:"31~60일 · 배우기",en:"Days 31–60 · Learn"})}</strong><div>${T({ko:"좋아요보다 저장, 댓글, 질문을 보고 사람들이 원하는 것을 배워요.",en:"Study saves, comments, and questions—not only likes."})}</div></div><div class="month"><strong>${T({ko:"61~90일 · 시험하기",en:"Days 61–90 · Test"})}</strong><div>${T({ko:"반응 좋은 형식을 반복하고 작은 수익 방법 하나만 시험해요.",en:"Repeat what works and test only one small revenue path."})}</div></div></div>`,api)}},
  {title:{ko:"현실적인 선택은 어느 쪽일까요?",en:"Which choice is realistic?"},instr:{ko:"가장 오래 지속할 수 있는 선택을 골라요.",en:"Choose the option that is most sustainable."},hint:{ko:"한 번에 하나씩!",en:"One thing at a time!"},build(api){els.stage.innerHTML=`<div class="choiceGrid"><button class="choice" data-right="0"><span class="emo">🚀</span>${T({ko:"매일 5개 플랫폼에 올리고 한 달 안에 수익 내기",en:"Post daily on five platforms and earn within a month"})}</button><button class="choice" data-right="1"><span class="emo">🌱</span>${T({ko:"90일 동안 한 플랫폼에 꾸준히 올리고 반응을 배우기",en:"Publish consistently on one platform for 90 days and learn from responses"})}</button></div>`;els.stage.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(b.dataset.right==="1"){b.classList.add("right");setTimeout(api.next,450)}else{b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),550)}})}},
  {title:{ko:"엄마의 즐거운 90일 계획",en:"Mom's fun-first 90-day plan"},instr:{ko:"고른 내용을 한 장으로 확인해요.",en:"Review your choices on one page."},hint:{ko:"이 계획은 의무가 아니라 재미를 위한 안내서예요.",en:"This is a guide for fun, not an obligation."},build(api){story(`<div class="plan"><h2>${T({ko:"나의 크리에이터 취미 계획",en:"My Creator Hobby Plan"})}</h2><div class="planRow"><b>${T({ko:"가장 중요한 것",en:"Top priority"})}</b><span>${T({ko:"영상을 만들며 즐겁게 지내기",en:"Have fun making videos"})}</span></div><div class="planRow"><b>${T({ko:"즐길 플랫폼",en:"Platform to enjoy"})}</b><span>${T(plan.platform)}</span></div><div class="planRow"><b>${T({ko:"첫 번째 실험",en:"First experiment"})}</b><span>${T(plan.focus)}</span></div><div class="planRow"><b>${T({ko:"가벼운 일정",en:"Gentle schedule"})}</b><span>${T(plan.pace)} · ${T({ko:"바쁘거나 재미없으면 쉬어도 됨",en:"pause whenever life is busy or it stops being fun"})}</span></div><div class="planRow"><b>${T({ko:"90일 목표",en:"90-day goal"})}</b><span>${T({ko:"여러 주제와 영상 방식을 실험하고, 가장 재미있는 것을 발견한다.",en:"Experiment with different topics and video styles, then notice which is most fun."})}</span></div><div class="planRow"><b>${T({ko:"수익 목표",en:"Revenue goal"})}</b><span>${T({ko:"0원이어도 성공. 생기는 수입은 즐거운 보너스!",en:"$0 is still success. Any income is a happy bonus!"})}</span></div></div>`,api)}}
];
let current=0,doneLock=false;
function loadLevel(i){current=i;doneLock=false;els.main.style.display="flex";els.final.style.display="none";const l=levels[i];document.getElementById("bTitle").textContent=T(l.title);document.getElementById("bInstr").innerHTML=T(l.instr);document.getElementById("bHint").textContent=T(l.hint);els.bar.style.width=((i/levels.length)*100)+"%";els.step.textContent=T(UI.step)(i+1,levels.length);l.build({next:nextLevel})}
function nextLevel(){if(doneLock)return;doneLock=true;els.overlay.style.display="flex";document.getElementById("successMsg").textContent=T({ko:"현실적이에요! 🌱",en:"That's realistic! 🌱"});setTimeout(()=>{els.overlay.style.display="none";if(current+1<levels.length)loadLevel(current+1);else finish()},600)}
function skipLevel(){if(current+1<levels.length)loadLevel(current+1);else finish()}function finish(){els.main.style.display="none";els.final.style.display="flex";els.bar.style.width="100%";els.step.textContent=T(UI.done);confetti()}function restart(){plan.platform={ko:"인스타그램",en:"Instagram"};plan.focus={ko:"내가 잘 아는 한 가지",en:"one topic I know well"};plan.pace={ko:"주 2회",en:"twice a week"};loadLevel(0)}
function confetti(){const e=["🌱","✨","💖","⭐","💛"];for(let i=0;i<24;i++){const c=document.createElement("div");c.className="confetti";c.textContent=e[Math.floor(Math.random()*e.length)];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(1.6+Math.random()*1.4)+"s";c.style.fontSize=(18+Math.random()*20)+"px";document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}
applyStatic();loadLevel(0);
</script>
